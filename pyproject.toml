[project]
name = "mini-react-agent"
version = "0.1.0"
description = "商家对话助手：手写 ReAct + create_agent + RAG + 结构化输出 + 评估"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langchain-openai",
    "langchain-core",
    "langchain-text-splitters",
    "langgraph",
    "python-dotenv",
    "loguru",
    "httpx",
    "pydantic",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
