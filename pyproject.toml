[project]
name = "mini-react-agent"
version = "0.1.0"
description = "商家对话助手：手写 ReAct + create_agent + RAG + 结构化输出 + 评估"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langchain-openai",
    "langchain-core",
    "langchain-text-splitters",
    "langgraph",
    "python-dotenv",
    "loguru",
    "httpx",
    "pydantic",
]

[dependency-groups]
dev = [
    "pytest",
]

# 脚本合集，不是可安装的包：不要 build 后端，
# 否则 setuptools 会把根目录 10 个脚本当成要打包的模块而报错
[tool.uv]
package = false
